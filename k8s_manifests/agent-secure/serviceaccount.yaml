# The name here is the identity. SPIRE's ClusterSPIFFEID
# (k8s_manifests/spire/values.yaml) assigns
# spiffe://nimbus.demo/ns/agents/sa/ai-support-agent-secure to any pod in
# the `agents` namespace labeled app=ai-support-agent-secure running under
# THIS service account -- rename either one and the identity silently stops
# matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-support-agent-secure
  namespace: agents
