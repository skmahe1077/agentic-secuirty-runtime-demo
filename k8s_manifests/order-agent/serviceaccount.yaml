# The name here is the identity -- same pattern as agent-secure's
# serviceaccount.yaml, a genuinely separate one. SPIRE's ClusterSPIFFEID
# (k8s_manifests/spire/values.yaml) assigns
# spiffe://nimbus.demo/ns/agents/sa/ai-order-agent to any pod in the
# `agents` namespace labeled app=ai-order-agent running under THIS service
# account -- rename either one and the identity silently stops matching.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-order-agent
  namespace: agents
