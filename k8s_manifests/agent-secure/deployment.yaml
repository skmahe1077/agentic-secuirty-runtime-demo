apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-secure
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-support-agent-secure
  template:
    metadata:
      # app label is load-bearing: SPIRE's ClusterSPIFFEID podSelector
      # matches on it. Renaming it breaks identity issuance, not just
      # scheduling.
      labels:
        app: ai-support-agent-secure
    spec:
      serviceAccountName: ai-support-agent-secure
      containers:
        - name: agent
          image: ${IMAGE_REGISTRY}/agent:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AGENT_MODE
              value: secure
            - name: AGENT_NAME
              value: support-agent-secure
            - name: DATABASE_HOST
              value: "${RDS_ENDPOINT}"
            - name: DATABASE_NAME
              value: "${DB_NAME}"
            - name: VAULT_ADDR
              value: "${VAULT_ADDR}"
            - name: VAULT_AUTH_MOUNT
              value: spiffe
            - name: VAULT_ROLE
              value: ai-support-agent-secure
            - name: VAULT_ROLE_POLICY
              value: agent-support
            - name: VAULT_REGISTRY_NAME
              value: refund-agent
            - name: VAULT_DB_MOUNT
              value: database
            - name: VAULT_DB_ROLE
              value: refund-writer
            - name: SVID_PATH
              value: /svids/jwt_svid.token
            - name: AGENT_ENGINE
              value: "${AGENT_ENGINE:-deterministic}"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-api-key, key: value, optional: true }
          volumeMounts:
            - name: svids
              mountPath: /svids
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }

        - name: spiffe-helper
          # Pinned, not :latest. spiffe-helper#451 is a concurrent-map-write
          # crash in daemon mode with JWT SVIDs -- this exact configuration.
          # Closed 2026-10-05; v0.12.2 (released 2026-10-09) is the first
          # tag after the fix. CONFIRM the fix is in v0.12.2's changelog and
          # the ghcr tag spelling before the talk -- an unpinned sidecar
          # that writes the SVID is the single highest-consequence pin in
          # this repo.
          image: ghcr.io/spiffe/spiffe-helper:0.12.2
          args: ["-config", "/etc/spiffe-helper/helper.conf"]
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: svids
              mountPath: /svids
            - name: helper-config
              mountPath: /etc/spiffe-helper
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }

      volumes:
        # No hostPath, no privileged pod -- the CSI driver bind-mounts the
        # SPIRE Agent's Workload API socket read-only.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: svids
          emptyDir: {}
        - name: helper-config
          configMap:
            name: spiffe-helper-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-secure
  namespace: agents
spec:
  selector:
    app: ai-support-agent-secure
  ports:
    - port: 8000
      targetPort: 8000
