<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mahi Stores</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wordmark">☁ Mahi Stores</div>
    <div class="topbar-controls">
      <label class="field-inline">
        Shopping as
        <select id="customer-picker"></select>
      </label>
      <label class="field-inline">
        Support agent
        <select id="agent-picker">
          <option value="insecure">Legacy (standing credential)</option>
          <option value="secure" selected>Zero-trust (SPIFFE + Vault JIT)</option>
        </select>
      </label>
      <button id="reset-btn" class="btn-ghost" title="Reset demo state">↺ Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="shop">
      <h2>Catalog</h2>
      <div id="products" class="product-grid"></div>

      <h2>My Orders</h2>
      <div id="orders" class="order-list"></div>

      <h2>Support</h2>
      <div class="chat-header">
        <span class="chat-avatar">💬</span>
        <div>
          <div class="chat-title">Mahi Stores Assistant</div>
          <div class="chat-status"><span class="status-dot good"></span>Online</div>
        </div>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-suggestions" class="chat-suggestions"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="e.g. Please refund order #1042" autocomplete="off" />
        <button type="submit">Send</button>
      </form>

      <div id="approval-card" class="approval-card hidden">
        <div class="approval-text"></div>
        <div class="approval-row">
          <input id="approver-name" type="text" placeholder="Your name" />
          <button id="approve-btn">Approve</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <h2>Security Flow</h2>

      <!-- Stage boxes are rendered entirely by app.js's STAGES config +
           renderFlow() -- their content (what/why/tags) lives in one place
           in the JS, not duplicated here. -->
      <div class="flow" id="flow"></div>

      <div class="stage-detail hidden" id="stage-detail">
        <button class="stage-detail-close" id="stage-detail-close" title="Close">×</button>
        <div class="stage-detail-label" id="stage-detail-label"></div>
        <div class="stage-detail-heading">What happens</div>
        <div class="stage-detail-body" id="stage-detail-what"></div>
        <div class="stage-detail-heading">Why it matters</div>
        <div class="stage-detail-body" id="stage-detail-why"></div>
        <div class="stage-detail-tags" id="stage-detail-tags"></div>
        <div class="stage-detail-live hidden" id="stage-detail-live"></div>
        <dl class="corr hidden" id="stage-detail-correlation">
          <dt>Approved by</dt>  <dd id="corr-approver">—</dd>
          <dt>Workload</dt>     <dd id="corr-spiffe">—</dd>
          <dt>Credential</dt>   <dd id="corr-lease">—</dd>
        </dl>
        <div class="meter hidden" id="stage-detail-meter-wrap"><div class="meter-fill" id="lease-meter"></div></div>
        <div class="stage-detail-heading">This run</div>
        <ul class="stage-detail-log" id="stage-detail-log"></ul>
        <button id="revoke-btn" class="btn-danger hidden">⨯ Revoke now</button>
      </div>

      <div class="tile">
        <!-- This is this app's own event feed, not Vault's audit log --
             that distinction matters now that the real audit log is
             configured (terraform/vault-config.tf's vault_audit) but
             deliberately not shown on stage. -->
        <div class="tile-label">Activity</div>
        <ul class="event-log" id="event-log"></ul>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
