# Helm values for the `spire` chart from the spiffe/helm-charts-hardened
# repo. Install `spire-crds` FIRST, then this chart:
#
#   helm repo add spiffe https://spiffe.github.io/helm-charts-hardened/
#   helm upgrade --install --create-namespace -n spire-mgmt spire-crds spire-crds \
#     --repo https://spiffe.github.io/helm-charts-hardened/
#   helm upgrade --install -n spire-mgmt spire spire \
#     --repo https://spiffe.github.io/helm-charts-hardened/ -f values.yaml
#
# The chart bundles SPIRE Server, SPIRE Agent, the Controller Manager, the
# SPIFFE CSI Driver, and the OIDC Discovery Provider. We don't use the OIDC
# Discovery Provider in this demo -- Vault validates against a static JWKS
# bundle instead (see docs/RUNBOOK.md: it is already written, already
# understood, and the stack is torn down daily, so there's little to gain
# from switching). Vault is now in the same cluster as SPIRE, so
# `profile = "https_spiffe_bundle"` against an in-cluster Service is a
# genuinely easy upgrade if the ~24h ca_ttl staleness ever becomes a
# problem -- but the chart still installs the OIDC provider either way; it
# is simply never pointed at by Vault config today.
global:
  spire:
    clusterName: agentic-sec-demo
    trustDomain: nimbus.demo
    recommendations:
      enabled: true # wires up k8s_psat node attestor + k8s workload attestor with sane defaults
    namespaces:
      create: true
  openshift: false

spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # refund-agent. Matches terraform/variables.tf's
        # agent_namespace/agent_service_account defaults and
        # vault-config.tf's workload_id_patterns / bound_subject. If you
        # change one, change all three.
        ai-support-agent-secure:
          namespaceSelector:
            matchExpressions:
              - key: "kubernetes.io/metadata.name"
                operator: In
                values: ["agents"]
          podSelector:
            matchLabels:
              app: ai-support-agent-secure
          # 5 minutes -- SPIRE's own default, left alone deliberately so
          # the "short-lived credential" story is true by default rather
          # than tuned to look good on stage.
          jwtTtl: "300s"
        # order-agent -- a genuinely separate identity, same namespace.
        # Matches terraform/variables.tf's order_agent_service_account and
        # vault-config.tf's spiffe_role_order_agent. The namespace boundary
        # already distinguishes nimbus/insecure from agents/secure; this
        # podSelector is what distinguishes the two secure identities from
        # each other within `agents`.
        ai-order-agent:
          namespaceSelector:
            matchExpressions:
              - key: "kubernetes.io/metadata.name"
                operator: In
                values: ["agents"]
          podSelector:
            matchLabels:
              app: ai-order-agent
          jwtTtl: "300s"
