# spiffe-helper writes the JWT-SVID to a file instead of the agent talking
# to the Workload API directly -- see docs/RUNBOOK.md on why: the Python
# `spiffe` library is 0.x with no official JWT-SVID example, too much risk
# on the live-demo critical path for a conference talk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config
  namespace: agents
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir      = "/svids"
    daemon_mode   = true
    jwt_svids = [
      { jwt_audience = "vault", jwt_svid_file_name = "jwt_svid.token" }
    ]
    # spiffe-helper#451: a known concurrent-map-write crash exists in
    # daemon mode with JWT SVIDs on some versions -- pin a version newer
    # than that fix before relying on this for the talk.
    renew_signal = "SIGUSR1"
