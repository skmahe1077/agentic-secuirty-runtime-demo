name: nimbus-demo

# Local stack: offline UI development only. Postgres + storefront +
# agent-insecure -- enough for beat 1 and all work on the storefront UI
# (including the Identity & Access panel). There is no Vault service and
# no SPIRE here: the demo is EKS-first now (a live, publicly reachable
# retail site), Vault Enterprise needs a license to even start, and
# without real SPIRE there is no SVID for agent-secure to present. Beats
# 2, 3, and 4 are EKS-only -- see docs/RUNBOOK.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: localdevonly
      POSTGRES_DB: nimbus
    ports:
      - "5432:5432"
    volumes:
      - ./app/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d nimbus"]
      interval: 2s
      timeout: 3s
      retries: 20

  storefront:
    build:
      context: .
      dockerfile: app/storefront/Dockerfile
    environment:
      # nimbus_storefront, not the Postgres superuser -- see
      # app/db/04_storefront_role.sql. Exercises the same least-privilege
      # role locally that the EKS deployment uses.
      DATABASE_URL: postgresql://nimbus_storefront:ChangeMeViaStorefrontDbPassword@postgres:5432/nimbus
      AGENT_INSECURE_URL: http://agent-insecure:8000
      # Deliberately left unset/unreachable -- there is no agent-secure
      # locally (see header comment). Selecting "secure" in the UI fails
      # cleanly ("unreachable") rather than silently serving insecure
      # traffic under the secure label.
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # The standing-access anti-pattern: a static password, no identity.
  agent-insecure:
    build:
      context: .
      dockerfile: app/agent/Dockerfile
    environment:
      AGENT_MODE: insecure
      AGENT_NAME: support-agent-insecure
      DATABASE_HOST: postgres
      DATABASE_NAME: nimbus
      STATIC_DB_USER: nimbus_app_legacy
      STATIC_DB_PASSWORD: LegacyStaticPassword123!
      AGENT_ENGINE: deterministic
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
