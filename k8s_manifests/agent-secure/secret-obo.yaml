# Throwaway OBO signing key. ${OBO_PRIVATE_KEY_PEM_B64} is
# terraform/obo-probe-keys/rar_probe_key.pem, base64'd onto one line:
#   base64 < terraform/obo-probe-keys/rar_probe_key.pem | tr -d '\n'
#
# This is the SAME key terraform/obo.tf registered as the "obo-probe"
# OAuth resource-server profile's public key (see docs/RUNBOOK.md's "OBO
# -- what was actually tested"). Demo-only, deliberately not a real IdP:
# `app/agent/src/agent/obo.py` signs the delegated OBO token itself using
# this key, standing in for what a real IdP's token-exchange endpoint
# would do in production -- see docs/RUNBOOK.md's Phase 0b finding for
# why IBM Verify specifically isn't wired in here (its documented
# token-exchange grant never mentions RFC 9396 authorization_details).
# In production this Secret doesn't exist at all: the agent never holds
# a signing key, a real IdP does.
apiVersion: v1
kind: Secret
metadata:
  name: obo-signing-key
  namespace: agents
type: Opaque
data:
  private_key.pem: "${OBO_PRIVATE_KEY_PEM_B64}"
