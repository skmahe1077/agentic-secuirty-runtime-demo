# THE ANTI-PATTERN. A static, long-lived DB password sitting in a Secret
# that any pod with RBAC access to `nimbus` secrets can read, mounted into
# a Deployment that holds it for its entire lifetime -- no SPIFFE identity,
# no Vault, no expiry. This is beat 1's exhibit, not a template to copy.
#
# `${...}` substituted by scripts/01-provision.sh. The password matches
# the `nimbus_app_legacy` role created in app/db/03_legacy_role.sql (local
# dev) / an equivalent role created once by hand against RDS for the real
# demo -- it is NOT Vault-managed, which is the entire point.
apiVersion: v1
kind: Secret
metadata:
  name: db-static-creds
  namespace: nimbus
type: Opaque
stringData:
  username: nimbus_app_legacy
  password: "${LEGACY_DB_PASSWORD}"
