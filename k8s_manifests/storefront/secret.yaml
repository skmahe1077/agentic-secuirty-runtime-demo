# The storefront's own DB credential -- see app/db/04_storefront_role.sql.
# Deliberately NOT the RDS master account: scripts/02-configure-vault.sh
# rotates that password via Vault, so nothing but Vault can use it after
# provisioning. ${STOREFRONT_DB_PASSWORD} is substituted by
# scripts/01-provision.sh via envsubst, same pattern as
# agent-insecure/secret.yaml's ${LEGACY_DB_PASSWORD}.
apiVersion: v1
kind: Secret
metadata:
  name: storefront-db-creds
  namespace: nimbus
type: Opaque
stringData:
  username: nimbus_storefront
  password: "${STOREFRONT_DB_PASSWORD}"
