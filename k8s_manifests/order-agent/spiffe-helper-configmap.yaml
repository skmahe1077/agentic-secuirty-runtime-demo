# Same pattern as agent-secure/spiffe-helper-configmap.yaml -- a separate
# ConfigMap (name must be unique within the `agents` namespace, both
# deployments live there) for a separate pod's sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config-order-agent
  namespace: agents
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir      = "/svids"
    daemon_mode   = true
    jwt_svids = [
      { jwt_audience = "vault", jwt_svid_file_name = "jwt_svid.token" }
    ]
    renew_signal = "SIGUSR1"
